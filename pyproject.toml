[project]
name = "llmrss"
version = "0.1.0"
description = "Daily news filter with an LLM: many sources in, one curated RSS feed out"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "tenacity>=8.2",
]

[project.scripts]
llmrss = "llmrss.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmrss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
